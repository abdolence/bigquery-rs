[package]
name = "bigquery"
version = "0.9.0"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "Library provides a simple API for Google BigQuery based on the gRPC Storage Read/Write and v2 APIs"
homepage = "https://bigquery-rust.abdolence.dev"
repository = "https://github.com/abdolence/bigquery-rs"
documentation = "https://docs.rs/bigquery"
keywords = ["bigquery", "google", "client"]
categories = ["api-bindings", "database"]
readme = "README.md"
# The published crate carries the library, the README, the licence, the book's pages and the
# `.sql` files its doctests embed, and nothing else from the repository.
include = ["Cargo.toml", "src/**/*.rs", "src/**/*.sql", "README.md", "LICENSE", "docs/src/**/*.md"]

[workspace]
members = ["smallquery"]
exclude = ["bench-compare"]

[workspace.package]
# One MSRV for every crate of the workspace: the engine's, which its storage and table-format
# dependencies set.
rust-version = "1.94.1"

# Versions of the engine's dependencies. The client's own entries move here when its
# dependencies are next rewritten, so that every shared version is declared once.
[workspace.dependencies]
bigquery = { path = ".", default-features = false }
anyhow = "1"
# The engine's Arrow, one major below the client's: the version DataFusion and iceberg-rust are
# built on. IPC crosses the two majors unchanged.
arrow = { version = "58.4", default-features = false, features = ["ipc_compression"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
console = "0.16"
# Pinned with iceberg-datafusion, which is built against exactly this release.
datafusion = "=53.1.0"
futures = "0.3"
gcloud-sdk = { version = "0.33.1", default-features = false, features = ["google-cloud-bigquery-v2", "google-cloud-bigquery-storage-v1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
iceberg = "0.10.1"
iceberg-datafusion = "0.10.1"
indicatif = "0.18"
parquet = { version = "58.4", default-features = false }
prost-reflect = "0.16"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "server", "channel"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
typetag = "0.2"
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[workspace.lints.clippy]
unwrap_used = "deny"
mod_module_files = "deny"

[badges]
maintenance = { status = "actively-developed" }

[package.metadata.docs.rs]
all-features = true

[lib]
name = "bigquery"
path = "src/lib.rs"

[features]
default = ["tls-roots", "auth-default-crypto"]
tls-roots = ["gcloud-sdk/tls-roots"]
tls-webpki-roots = ["gcloud-sdk/tls-webpki-roots"]
# The aws-lc-rs rustls crypto provider of google-cloud-auth, which signs with service account keys.
# Without it, the application installs a rustls `CryptoProvider` before creating a client.
auth-default-crypto = ["gcloud-sdk/auth-default-crypto"]
# Exposes the row encoder alone to `benches/write_codec.rs`; not part of the API.
bench-internals = []

[dependencies]
tracing = "0.1"
gcloud-sdk = { version = "0.33.1", default-features = false, features = ["google-cloud-bigquery-v2", "google-cloud-bigquery-storage-v1"] }
hyper = { version = "1" }
rsb_derive = "0.5.3"
# `net` and `macros` serve the loopback server of `bigquery::testing`.
tokio = { version = "1", features = ["time", "sync", "rt", "net", "macros"] }
async-trait = "0.1"
rand = "0.10"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jiff = { version = "0.2", features = ["serde"] }
base64 = "0.22"
struct-path = "0.2"
arrow-array = "60"
arrow-schema = "60"
arrow-buffer = "60"
arrow-ipc = { version = "60", default-features = false, features = ["lz4", "zstd"] }
url = { version = "2.5", features = ["serde"] }
# The raw HTTP/2 server behind `bigquery::testing`; already in the tree through hyper and tonic.
h2 = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Installs a default rustls crypto provider for the tests, see the crypto provider section of the book.
rustls = "0.23"
# The integration tests build raw requests for the clients this crate hands out.
gcloud-sdk = { version = "0.33.1", default-features = false, features = ["google-cloud-bigquery-v2", "google-cloud-bigquery-storage-v1"] }
proptest = "1"
# Decodes the write path's protobuf rows against the descriptor the crate built for them.
prost-reflect = "0.16"
criterion = "0.8"
# A BYTES target the codec tests cover alongside `Vec<u8>`.
serde_bytes = "0.11"
# Verifies the JWT a service account key signs; google-cloud-auth already depends on it.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }

[[bench]]
name = "read_codec"
harness = false

[[bench]]
name = "write_codec"
harness = false
required-features = ["bench-internals"]

[lints.clippy]
unwrap_used = "deny"
mod_module_files = "deny"
