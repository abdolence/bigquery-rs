[package]
name = "smallquery"
version = "0.1.0"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
rust-version.workspace = true
license = "Apache-2.0"
description = "A lightweight BigQuery engine over Apache Iceberg tables that serves the BigQuery gRPC APIs"
homepage = "https://bigquery-rust.abdolence.dev"
repository = "https://github.com/abdolence/bigquery-rs"
keywords = ["bigquery", "iceberg", "embedded", "server"]
categories = ["database-implementations"]
# The generated server traits are committed, so a build needs neither the protos nor `protoc`.
include = ["Cargo.toml", "src/**/*.rs"]

[lib]
name = "smallquery"
path = "src/lib.rs"

[[bin]]
name = "smallquery"
path = "src/bin/smallquery/main.rs"
required-features = ["cli"]

[features]
default = ["tls-webpki-roots"]
# gcloud-sdk builds its client channels with one of these two; with neither it does not
# compile, so a build without the default feature enables the other.
tls-roots = ["gcloud-sdk/tls-roots"]
tls-webpki-roots = ["gcloud-sdk/tls-webpki-roots"]
# The `smallquery` binary; off by default so that the library pulls in no CLI dependencies.
cli = ["dep:anyhow", "dep:clap", "dep:console", "dep:indicatif", "dep:tracing-subscriber", "tokio/signal"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait.workspace = true
bytes.workspace = true
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
futures.workspace = true
gcloud-sdk.workspace = true
hyper-util.workspace = true
iceberg.workspace = true
indicatif = { workspace = true, optional = true }
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
typetag.workspace = true
unicode-properties.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["serde"] }

[dev-dependencies]
bigquery = { workspace = true, features = ["tls-webpki-roots"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
